# app.conf

# beego

# non overridable
appname = terceros_crud
autorender = false
copyrequestbody = true

# overridable
enabledocs = ${TERCEROS_CRUD_ENABLEDOCS||false}
httpport = ${TERCEROS_CRUD_HTTP_PORT}
runmode = ${TERCEROS_CRUD_RUN_MODE||prod}
#httpport = 8013
#runmode = dev
# oas
parameterStore = ${PARAMETER_STORE}
# non overridable
PGschema = ${TERCEROS_CRUD_PGSCHEMA}

# must be set at runtime
PGdb   = ${TERCEROS_CRUD_PGDB}
PGport = ${TERCEROS_CRUD_PGPORT}
PGpass = ${TERCEROS_CRUD_PGPASS}
PGurls = ${TERCEROS_CRUD_PGHOST}
PGuser = ${TERCEROS_CRUD_PGUSER}
